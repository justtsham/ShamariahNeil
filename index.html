<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shamariah Neil | Voice Actor</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

:root{
  --cream:#f9f3ec;
  --cream2:#fffaf5;
  --pink1:#f6a6c9;
  --pink2:#fbd3e6;
  --text:#2a0820;
  --card: rgba(255,255,255,.86);
  --borderPink: rgba(246,166,201,.78);
  --borderPinkSoft: rgba(246,166,201,.55);
  --shadow: 0 24px 60px rgba(0,0,0,.12);
  --shadow2: 0 12px 26px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:var(--text);

  background:
    radial-gradient(1100px 820px at 12% 12%, rgba(246,166,201,.34), transparent 60%),
    radial-gradient(1000px 760px at 88% 18%, rgba(251,211,230,.32), transparent 62%),
    linear-gradient(180deg, var(--cream), var(--cream2));

  background-attachment: fixed;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:6px 6px 10px;
  flex-wrap:wrap;
}

.brand{
  text-decoration:none;
  display:flex;
  align-items:baseline;
  gap:10px;
}

.brand .first,
.brand .last{
  font-family:'Allura', cursive;
  font-size:58px;
  color:#e05a97;
}

nav{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

nav a.tab{
  text-decoration:none;
  font-weight:900;
  font-size:14px;
  padding:8px 10px;
  border-radius:999px;
  color:var(--text);
}

nav a.tab:hover{
  background: rgba(255,255,255,.65);
}

.panel{
  border-radius:30px;
  overflow:hidden;
  box-shadow: var(--shadow);
  border:2px solid var(--borderPink);
  background:
    radial-gradient(900px 520px at 80% 10%, rgba(246,166,201,.18), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.30));
  padding:18px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background: var(--card);
  border-radius:24px;
  padding:18px;
  border:2px solid var(--borderPink);
  box-shadow: var(--shadow2);
}

.sectionTitle h1{
  margin:0;
  font-family:'Playfair Display', serif;
  font-size:30px;
}

/* ===== PRIVACY POLICY PAGE ===== */

.privacyWrap{
  margin-top:12px;
  padding:24px;
  border-radius:20px;
  border:2px solid var(--borderPinkSoft);
  background: rgba(255,255,255,.88);
  max-height:70vh;
  overflow-y:auto;
  box-shadow: var(--shadow2);
}

.privacyWrap::-webkit-scrollbar{
  width:10px;
}

.privacyWrap::-webkit-scrollbar-thumb{
  background: var(--pink1);
  border-radius:999px;
}

/* PRIVACY POLICY CUSTOM STYLING */

[data-custom-class='body'],
[data-custom-class='body'] * {
  background: transparent !important;
}

[data-custom-class='title'],
[data-custom-class='title'] * {
  font-family: 'Playfair Display', serif !important;
  color: #2a0820 !important;
}

[data-custom-class='heading_1'],
[data-custom-class='heading_1'] * {
  font-family: 'Playfair Display', serif !important;
  color: #2a0820 !important;
}

[data-custom-class='heading_2'],
[data-custom-class='heading_2'] * {
  font-family: 'Playfair Display', serif !important;
  color: #2a0820 !important;
}

[data-custom-class='body_text'],
[data-custom-class='body_text'] * {
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial !important;
  color: #4b3040 !important;
  line-height: 1.7 !important;
}

[data-custom-class='link'],
[data-custom-class='link'] * {
  color: #d85a95 !important;
  font-weight:700 !important;
}

@media (max-width: 640px){

  .brand .first,
  .brand .last{
    font-size:40px;
  }

}

  </style>
</head>

<body>

<div class="wrap">

  <!-- TOP NAV -->
  <div class="topbar">

    <a class="brand" href="#home" data-tab="home">
      <span class="first">Shamariah</span>
      <span class="last">Neil</span>
    </a>

    <nav>

      <a class="tab" href="#home" data-tab="home">Home</a>

      <a class="tab" href="#demos" data-tab="demos">

      </a>

      <a class="tab" href="#studio" data-tab="studio">
        Home Studio
      </a>

      <a class="tab" href="#resume" data-tab="resume">
        Resume
      </a>

      <a class="tab" href="#contact" data-tab="contact">
        Contact Me
      </a>

      <!-- NEW TAB -->
      <a class="tab" href="#privacy" data-tab="privacy">
        Privacy Policy
      </a>

    </nav>

  </div>

  <div class="panel">

    <!-- HOME -->
    <section id="page-home" class="page active">
      <div class="card">
        <div class="sectionTitle">
          <h1>Welcome</h1>
        </div>

        <p>
          Professional voice actor specializing in commercial,
          animation, gaming, and narration.
        </p>
      </div>
    </section>

    <!-- PRIVACY POLICY PAGE -->
    <section id="page-privacy" class="page">

      <div class="card">

        <div class="sectionTitle">
          <h1>Privacy Policy</h1>
        </div>

        <div class="privacyWrap">

<!-- PASTE YOUR FULL PRIVACY POLICY HTML HERE -->

}
</style>

<div data-custom-class="body">

</div>

        </div>

      </div>

    </section>

  </div>

</div>

<script>

const tabs = document.querySelectorAll('[data-tab]');
const pages = document.querySelectorAll('.page');

tabs.forEach(tab => {

  tab.addEventListener('click', (e) => {

    e.preventDefault();

    const target = tab.dataset.tab;

    pages.forEach(page => {
      page.classList.remove('active');
    });

    const activePage = document.getElementById(`page-${target}`);

    if(activePage){
      activePage.classList.add('active');
    }

  });

});

</script>

</body>
</html>
